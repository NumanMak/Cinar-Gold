name: Altın fiyatlarını güncelle

# Özsafir Gold sitesinin herkese açık fiyat tablosunu okuyup assets/data/gold.json dosyasını günceller.
# Dosya yalnızca fiyat değiştiğinde (veya 12 saatte bir) değişir, bu yüzden commit sayısı düşük kalır.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gold-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Birim testleri
        run: python -m unittest discover -s tools -p "test_*.py"
      - name: Fiyatları çek
        run: python tools/fetch_gold.py
      - name: Değiştiyse commit et
        run: |
          if [ -n "$(git status --porcelain assets/data/gold.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/data/gold.json
            git commit -m "Altın fiyatları güncellendi"
            git push
          fi
